name: TaskSAT semantic boundary audit

on:
  push:
    branches:
      - tasksat-semantic-boundary-audit-v1
    paths:
      - ".github/workflows/tasksat_semantic_boundary_audit.yml"
      - "research/tasksat_semantic_boundary/minimal_bounds_assignment.tn"
      - "research/tasksat_semantic_boundary/run_audit.py"
      - "research/tasksat_semantic_boundary/LeanWitness.lean"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  dual-semantics:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout MathGraph audit branch
        uses: actions/checkout@v4

      - name: Checkout frozen TaskSAT
        uses: actions/checkout@v4
        with:
          repository: nasa-jpl/tasksat
          ref: f9d6063b45967a3fea578c47f54806aadaafe1b0
          path: upstream
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install TaskSAT SMT dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install lark==1.3.1 ply==3.11 z3-solver==4.15.4.0

      - name: Execute pinned Python SMT witness
        run: |
          python research/tasksat_semantic_boundary/run_audit.py \
            --tasksat-root upstream \
            --spec research/tasksat_semantic_boundary/minimal_bounds_assignment.tn

      - name: Build frozen upstream Lean validator
        uses: leanprover/lean-action@v1
        with:
          lake-package-directory: upstream/src/lean/TaskNetExec
          build: "true"
          test: "false"
          lint: "false"
          use-github-cache: "true"

      - name: Execute pinned Lean witness
        working-directory: upstream/src/lean/TaskNetExec
        run: |
          lake env lean --run "$GITHUB_WORKSPACE/research/tasksat_semantic_boundary/LeanWitness.lean"
