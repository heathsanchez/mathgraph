name: Trace Ace V152 Transition Law Discovery
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/trace-ace-transcript-cache-seed.yml'
      - 'competitions/trace_the_ace/V152_TRIGGER.txt'
  workflow_dispatch:
permissions:
  contents: write
  actions: read
concurrency:
  group: trace-ace-v152-transition-law-discovery
  cancel-in-progress: true
env:
  TRANSCRIPT_KEY: trace-ace-transcripts-v1-603547640
  TRANSCRIPT_SHA: e685b85b04694e130c25b17d09cdd1892fbda5e9fa685e98b2300114b915aa2d
  SCIENCE_REF: agent/v152-transition-law-discovery
jobs:
  v152:
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.SCIENCE_REF }}
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - name: Record V152 start
        run: |
          python - <<'PY'
          import json,os,pathlib
          pathlib.Path('/tmp/V152_RUN_START.json').write_text(json.dumps({'run_id':int(os.environ['GITHUB_RUN_ID']),'status':'STARTED','science_ref':os.environ['SCIENCE_REF']},indent=2))
          PY
          git fetch origin main
          git worktree add /tmp/v152-start origin/main
          cd /tmp/v152-start
          mkdir -p competitions/trace_the_ace/results
          cp /tmp/V152_RUN_START.json competitions/trace_the_ace/results/V152_RUN_START.json
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add competitions/trace_the_ace/results/V152_RUN_START.json
          git commit -m "results: record V152 run start $GITHUB_RUN_ID" || true
          git push origin HEAD:main || true
      - name: Install dependencies
        run: python -m pip install --disable-pip-version-check numpy pandas scipy scikit-learn gdown
      - name: Restore exact transcript cache
        uses: actions/cache/restore@v4
        with:
          path: transcripts.zip
          key: ${{ env.TRANSCRIPT_KEY }}
          fail-on-cache-miss: true
      - name: Validate transcript cache
        run: |
          set -euo pipefail
          test "$(stat -c%s transcripts.zip)" = '603547640'
          test "$(sha256sum transcripts.zip | cut -d' ' -f1)" = "$TRANSCRIPT_SHA"
      - name: Download metadata and extract
        run: |
          set -euo pipefail
          gdown 1EpqoamY0vFI2qE57R6wdqU5HwuoVk3Zz -O metadata.zip
          mkdir -p data/meta data/transcripts
          unzip -q metadata.zip -d data/meta
          unzip -q transcripts.zip -d data/transcripts
          echo "FEATURES=$(find data/meta -type f -name 'train_features*.csv' -print -quit)" >> "$GITHUB_ENV"
          echo "LABELS=$(find data/meta -type f -name 'train_labels*.csv' -print -quit)" >> "$GITHUB_ENV"
          FIRST=$(find data/transcripts -type f -name '*.csv' -print -quit)
          echo "TRANSCRIPTS=$(dirname "$FIRST")" >> "$GITHUB_ENV"
      - name: Compile frozen V152
        run: python -m py_compile competitions/trace_the_ace/v152_transition_law_discovery.py
      - name: Run frozen V152 discovery
        run: |
          cd competitions/trace_the_ace
          python v152_transition_law_discovery.py \
            --features "../../$FEATURES" --labels "../../$LABELS" --transcripts "../../$TRANSCRIPTS" \
            --out ../../v152_transition_law_discovery.json
      - name: Show V152 decision
        if: always()
        run: cat v152_transition_law_discovery.json || true
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: trace-ace-v152-transition-law-discovery
          path: v152_transition_law_discovery.json
          if-no-files-found: warn
          retention-days: 14
      - name: Record V152 completion
        if: always()
        run: |
          python - <<'PY'
          import json,os,pathlib
          p=pathlib.Path('v152_transition_law_discovery.json')
          out={'run_id':int(os.environ['GITHUB_RUN_ID']),'status':'FINAL','result_exists':p.exists()}
          if p.exists():
              r=json.loads(p.read_text()); out['verdict']=r.get('decision',{}).get('verdict'); out['session_gain']=r.get('session_grouped',{}).get('gain_transition_vs_v135'); out['objective_gain']=r.get('objective_grouped',{}).get('gain_transition_vs_v135')
          pathlib.Path('/tmp/V152_RUN_FINAL.json').write_text(json.dumps(out,indent=2)); print(json.dumps(out,indent=2))
          PY
          git fetch origin main
          git worktree add /tmp/v152-final origin/main
          cd /tmp/v152-final
          mkdir -p competitions/trace_the_ace/results
          cp /tmp/V152_RUN_FINAL.json competitions/trace_the_ace/results/V152_RUN_FINAL.json
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add competitions/trace_the_ace/results/V152_RUN_FINAL.json
          git commit -m "results: record V152 final $GITHUB_RUN_ID" || true
          git push origin HEAD:main || true
