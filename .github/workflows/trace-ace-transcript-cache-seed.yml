name: Trace Ace V144 Smoke Response Curve
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/trace-ace-transcript-cache-seed.yml'
  workflow_dispatch:
permissions:
  contents: write
  actions: read
jobs:
  probes:
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
        with: {ref: agent/v144-smoke-directional-probes}
      - name: Record V144 run start
        run: |
          python - <<'PY'
          import json,os,pathlib
          pathlib.Path('/tmp/V144_RUN_START.json').write_text(json.dumps({'run_id':int(os.environ['GITHUB_RUN_ID']),'status':'STARTED'},indent=2))
          PY
          git fetch origin main
          git worktree add /tmp/v144-start origin/main
          cd /tmp/v144-start
          mkdir -p competitions/trace_the_ace/results
          cp /tmp/V144_RUN_START.json competitions/trace_the_ace/results/V144_RUN_START.json
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add competitions/trace_the_ace/results/V144_RUN_START.json
          git commit -m "results: record V144 run start $GITHUB_RUN_ID" || true
          git push origin HEAD:main || true
      - name: Download exact green V135 candidate
        env: {GH_TOKEN: '${{ github.token }}'}
        run: |
          set -euo pipefail
          curl -L --fail -H "Authorization: Bearer $GH_TOKEN" -H 'Accept: application/vnd.github+json' https://api.github.com/repos/heathsanchez/mathgraph/actions/artifacts/9490954282/zip -o v142_artifact.zip
          mkdir -p /tmp/v142_art /tmp/v135_base
          unzip -q v142_artifact.zip -d /tmp/v142_art
          test -f /tmp/v142_art/trace_ace_v135_submission.zip
          echo '12e1d73c725d21830687d32cf6e9e1a8d81feb767ce3e1b23000e5a01cb4996a  /tmp/v142_art/trace_ace_v135_submission.zip' | sha256sum -c -
          unzip -q /tmp/v142_art/trace_ace_v135_submission.zip -d /tmp/v135_base
          test -f /tmp/v135_base/main.py
      - name: Build four frozen V144 smoke probes
        run: |
          set -euo pipefail
          python competitions/trace_the_ace/v144_build_smoke_probes.py --baseline /tmp/v135_base --out v144_probes
          for z in v144_probes/*.zip; do
            unzip -Z1 "$z" | grep -qx 'main.py'
            sha256sum "$z"
          done
      - name: Checkout official runtime
        uses: actions/checkout@v4
        with:
          repository: drivendataorg/tutoring-outcomes-runtime
          ref: main
          path: official
      - name: Pull exact official runtime image once
        run: |
          set -euo pipefail
          docker pull tutoringoutcomeschallengeprodacr.azurecr.io/tutoring-outcomes-runtime:gpu-latest
          docker image inspect tutoringoutcomeschallengeprodacr.azurecr.io/tutoring-outcomes-runtime:gpu-latest --format '{{.Id}}' | tee v144_image_id.txt
      - name: Validate all four probes offline in official container
        run: |
          set -euo pipefail
          mkdir -p v144_evidence
          for z in v144_probes/*.zip; do
            tag=$(basename "$z" .zip)
            echo "===== $tag ====="
            rm -rf official/submission
            mkdir -p official/submission
            chmod -R 0777 official/submission
            cp "$z" official/submission/submission.zip
            docker run --platform linux/amd64 --network none --rm \
              -e LOGURU_LEVEL=INFO -e IS_SMOKE_TEST=1 \
              --mount type=bind,source="$PWD/official/data-demo",target=/code_execution/data,readonly \
              --mount type=bind,source="$PWD/official/submission",target=/code_execution/submission \
              --shm-size 8g --pid host \
              tutoringoutcomeschallengeprodacr.azurecr.io/tutoring-outcomes-runtime:gpu-latest
            test -f official/submission/submission.csv
            test -f official/submission/log.txt
            python competitions/trace_the_ace/v144_validate_submission.py \
              --format official/data-demo/submission_format.csv \
              --submission official/submission/submission.csv \
              --tag "$tag" --out "v144_evidence/${tag}.json"
            cp official/submission/log.txt "v144_evidence/${tag}.log"
          done
      - uses: actions/upload-artifact@v4
        with:
          name: trace-ace-v144-smoke-probes
          path: |
            v144_probes/*.zip
            v144_evidence/*
            v144_image_id.txt
          retention-days: 14
      - name: Record V144 completion
        if: always()
        run: |
          python - <<'PY'
          import json,os,pathlib
          zs=sorted(p.name for p in pathlib.Path('v144_probes').glob('*.zip')) if pathlib.Path('v144_probes').exists() else []
          ev=sorted(p.name for p in pathlib.Path('v144_evidence').glob('*.json')) if pathlib.Path('v144_evidence').exists() else []
          out={'run_id':int(os.environ['GITHUB_RUN_ID']),'status':'FINAL','probe_zips':zs,'validated':ev}
          pathlib.Path('/tmp/V144_RUN_FINAL.json').write_text(json.dumps(out,indent=2))
          print(json.dumps(out,indent=2))
          PY
          git fetch origin main
          git worktree add /tmp/v144-final origin/main
          cd /tmp/v144-final
          mkdir -p competitions/trace_the_ace/results
          cp /tmp/V144_RUN_FINAL.json competitions/trace_the_ace/results/V144_RUN_FINAL.json
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add competitions/trace_the_ace/results/V144_RUN_FINAL.json
          git commit -m "results: record V144 final $GITHUB_RUN_ID" || true
          git push origin HEAD:main || true
