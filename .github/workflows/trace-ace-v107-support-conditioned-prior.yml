name: Trace the Ace V107 support-conditioned prior
on:
  workflow_dispatch:
  push:
    branches: [agent/trace-ace-mastery-events]
    paths:
      - 'competitions/trace_the_ace/v107_support_conditioned_prior.py'
      - '.github/workflows/trace-ace-v107-support-conditioned-prior.yml'

jobs:
  confirmation:
    runs-on: ubuntu-latest
    timeout-minutes: 360
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - name: Install dependencies
        run: python -m pip install --disable-pip-version-check numpy pandas scipy scikit-learn gdown
      - name: Download frozen training data
        run: |
          set -euo pipefail
          gdown 1nOjremWhpZ_QKSLvZfGcNkS_C3kMMBUI -O transcripts.zip
          gdown 1EpqoamY0vFI2qE57R6wdqU5HwuoVk3Zz -O metadata.zip
          mkdir -p data/transcripts data/meta
          unzip -q transcripts.zip -d data/transcripts
          unzip -q metadata.zip -d data/meta
      - name: Resolve schemas
        run: |
          set -euo pipefail
          FEATURES=$(find data/meta -type f -name 'train_features*.csv' -print -quit)
          LABELS=$(find data/meta -type f -name 'train_labels*.csv' -print -quit)
          FIRST=$(find data/transcripts -type f -name '*.csv' -print -quit)
          TRANSCRIPTS=$(dirname "$FIRST")
          echo "FEATURES=$FEATURES" >> "$GITHUB_ENV"
          echo "LABELS=$LABELS" >> "$GITHUB_ENV"
          echo "TRANSCRIPTS=$TRANSCRIPTS" >> "$GITHUB_ENV"
      - name: Syntax check V107
        run: python -m py_compile competitions/trace_the_ace/v107_support_conditioned_prior.py
      - name: Run V107 support-conditioned prior
        run: |
          cd competitions/trace_the_ace
          python v107_support_conditioned_prior.py \
            --features "../../$FEATURES" --labels "../../$LABELS" --transcripts "../../$TRANSCRIPTS" \
            --out ../../v107_support_conditioned_prior.json
      - name: Show decision
        if: always()
        run: cat v107_support_conditioned_prior.json
      - name: Upload V107 evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: trace-ace-v107-support-conditioned-prior
          path: v107_support_conditioned_prior.json
          retention-days: 14
