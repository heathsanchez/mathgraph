name: Trace the Ace V109 supervised semantics
on:
  workflow_dispatch:
  push:
    branches: [agent/trace-ace-mastery-events]
    paths: ['competitions/trace_the_ace/v109_supervised_objective_semantics.py','.github/workflows/trace-ace-v109-supervised-semantics.yml']
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 360
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.12', cache: pip}
      - run: python -m pip install --disable-pip-version-check numpy pandas scipy scikit-learn gdown
      - name: Download frozen data
        run: |
          gdown 1nOjremWhpZ_QKSLvZfGcNkS_C3kMMBUI -O transcripts.zip
          gdown 1EpqoamY0vFI2qE57R6wdqU5HwuoVk3Zz -O metadata.zip
          mkdir -p data/transcripts data/meta; unzip -q transcripts.zip -d data/transcripts; unzip -q metadata.zip -d data/meta
          echo "FEATURES=$(find data/meta -name 'train_features*.csv' -print -quit)" >> $GITHUB_ENV
          echo "LABELS=$(find data/meta -name 'train_labels*.csv' -print -quit)" >> $GITHUB_ENV
          echo "TRANSCRIPTS=$(dirname $(find data/transcripts -name '*.csv' -print -quit))" >> $GITHUB_ENV
      - run: python -m py_compile competitions/trace_the_ace/v109_supervised_objective_semantics.py
      - name: Run V109
        run: cd competitions/trace_the_ace && python v109_supervised_objective_semantics.py --features ../../$FEATURES --labels ../../$LABELS --transcripts ../../$TRANSCRIPTS --out ../../v109.json
      - if: always()
        uses: actions/upload-artifact@v4
        with: {name: trace-ace-v109-supervised-semantics, path: v109.json, retention-days: 14}
