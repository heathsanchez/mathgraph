name: Trace the Ace V110 residual collider state discovery
on:
  push:
    branches: [agent/trace-ace-mastery-events]
    paths:
      - 'competitions/trace_the_ace/v110_residual_collider_state_discovery.py'
      - '.github/workflows/trace-ace-v110-residual-collider-state.yml'
  workflow_dispatch:
jobs:
  discovery:
    runs-on: ubuntu-24.04
    timeout-minutes: 360
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - name: Install dependencies
        run: python -m pip install --disable-pip-version-check numpy pandas scipy scikit-learn gdown
      - name: Download frozen data
        run: |
          set -euo pipefail
          gdown 1nOjremWhpZ_QKSLvZfGcNkS_C3kMMBUI -O transcripts.zip
          gdown 1EpqoamY0vFI2qE57R6wdqU5HwuoVk3Zz -O metadata.zip
          mkdir -p data/transcripts data/meta
          unzip -q transcripts.zip -d data/transcripts
          unzip -q metadata.zip -d data/meta
      - name: Resolve schemas
        run: |
          set -euo pipefail
          FEATURES=$(find data/meta -type f -name 'train_features*.csv' -print -quit)
          LABELS=$(find data/meta -type f -name 'train_labels*.csv' -print -quit)
          FIRST=$(find data/transcripts -type f -name '*.csv' -print -quit)
          TRANSCRIPTS=$(dirname "$FIRST")
          echo "FEATURES=$FEATURES" >> "$GITHUB_ENV"
          echo "LABELS=$LABELS" >> "$GITHUB_ENV"
          echo "TRANSCRIPTS=$TRANSCRIPTS" >> "$GITHUB_ENV"
      - name: Syntax check
        run: python -m py_compile competitions/trace_the_ace/v110_residual_collider_state_discovery.py
      - name: Run V110 phase-change search
        run: |
          cd competitions/trace_the_ace
          python v110_residual_collider_state_discovery.py --features "../../$FEATURES" --labels "../../$LABELS" --transcripts "../../$TRANSCRIPTS" --out ../../v110_residual_collider_state_discovery.json
      - name: Show decision
        if: always()
        run: cat v110_residual_collider_state_discovery.json || true
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: trace-ace-v110-residual-collider-state
          path: v110_residual_collider_state_discovery.json
          retention-days: 14
