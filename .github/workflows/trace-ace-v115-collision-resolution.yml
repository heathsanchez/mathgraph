name: Trace Ace V115 Collision Resolution
on:
  pull_request:
    branches: [agent/trace-ace-mastery-events]
    paths:
      - 'competitions/trace_the_ace/v115_collision_resolution_knn.py'
      - 'competitions/trace_the_ace/v114_representation_applicability.py'
      - '.github/workflows/trace-ace-v115-collision-resolution.yml'
  workflow_dispatch:
jobs:
  screen:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - run: python -m pip install --disable-pip-version-check numpy pandas scipy scikit-learn gdown
      - name: Download frozen data
        run: |
          gdown 1nOjremWhpZ_QKSLvZfGcNkS_C3kMMBUI -O transcripts.zip
          gdown 1EpqoamY0vFI2qE57R6wdqU5HwuoVk3Zz -O metadata.zip
          mkdir -p data/transcripts data/meta
          unzip -q transcripts.zip -d data/transcripts
          unzip -q metadata.zip -d data/meta
      - name: Resolve schemas
        run: |
          FEATURES=$(find data/meta -type f -name 'train_features*.csv' -print -quit)
          LABELS=$(find data/meta -type f -name 'train_labels*.csv' -print -quit)
          FIRST=$(find data/transcripts -type f -name '*.csv' -print -quit)
          TRANSCRIPTS=$(dirname "$FIRST")
          echo "FEATURES=$FEATURES" >> "$GITHUB_ENV"
          echo "LABELS=$LABELS" >> "$GITHUB_ENV"
          echo "TRANSCRIPTS=$TRANSCRIPTS" >> "$GITHUB_ENV"
      - name: Preflight import
        run: |
          cd competitions/trace_the_ace
          python -m py_compile v114_representation_applicability.py v115_collision_resolution_knn.py
      - name: Run V115
        run: |
          cd competitions/trace_the_ace
          python v115_collision_resolution_knn.py --features "../../$FEATURES" --labels "../../$LABELS" --transcripts "../../$TRANSCRIPTS" --rows 2500 --out ../../v115_collision_resolution_knn.json
      - name: Show decision
        run: cat v115_collision_resolution_knn.json
      - uses: actions/upload-artifact@v4
        with:
          name: trace-ace-v115-collision-resolution-knn
          path: v115_collision_resolution_knn.json
          retention-days: 14
