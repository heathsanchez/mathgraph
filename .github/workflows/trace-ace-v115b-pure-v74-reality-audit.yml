name: Trace Ace V115b Pure V74 Reality Audit
on:
  pull_request:
    branches: [agent/trace-ace-mastery-events]
    paths:
      - 'competitions/trace_the_ace/v115b_pure_v74_reality_audit.py'
      - '.github/workflows/trace-ace-v115b-pure-v74-reality-audit.yml'
  workflow_dispatch:
jobs:
  audit:
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - run: python -m pip install --disable-pip-version-check numpy pandas scipy scikit-learn gdown
      - name: Download metadata
        run: |
          gdown 1EpqoamY0vFI2qE57R6wdqU5HwuoVk3Zz -O metadata.zip
          mkdir -p data/meta
          unzip -q metadata.zip -d data/meta
      - name: Resolve schemas
        run: |
          FEATURES=$(find data/meta -type f -name 'train_features*.csv' -print -quit)
          LABELS=$(find data/meta -type f -name 'train_labels*.csv' -print -quit)
          echo "FEATURES=$FEATURES" >> "$GITHUB_ENV"
          echo "LABELS=$LABELS" >> "$GITHUB_ENV"
      - name: Preflight compile
        run: |
          cd competitions/trace_the_ace
          python -m py_compile v115b_pure_v74_reality_audit.py
      - name: Run V115b
        run: |
          cd competitions/trace_the_ace
          python v115b_pure_v74_reality_audit.py --features "../../$FEATURES" --labels "../../$LABELS" --out ../../v115b_pure_v74_reality_audit.json
      - name: Show decision
        run: cat v115b_pure_v74_reality_audit.json
      - uses: actions/upload-artifact@v4
        with:
          name: trace-ace-v115b-pure-v74-reality-audit
          path: v115b_pure_v74_reality_audit.json
          retention-days: 14
