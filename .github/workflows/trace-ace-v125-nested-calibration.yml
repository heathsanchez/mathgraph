name: Trace Ace V125 Nested Calibration
on:
  pull_request:
    branches: [agent/v111-runner]
    paths:
      - 'competitions/trace_the_ace/v125_nested_calibration.py'
      - '.github/workflows/trace-ace-v125-nested-calibration.yml'
  workflow_dispatch:

jobs:
  calibration:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - name: Install dependencies
        run: python -m pip install --disable-pip-version-check numpy pandas scipy scikit-learn gdown
      - name: Restore frozen transcripts
        uses: actions/cache/restore@v4
        with:
          path: transcripts.zip
          key: trace-ace-transcripts-v1-603547640
          fail-on-cache-miss: true
      - name: Validate and extract data
        shell: bash
        run: |
          set -euo pipefail
          test "$(stat -c%s transcripts.zip)" = "603547640"
          unzip -tq transcripts.zip >/dev/null
          test "$(sha256sum transcripts.zip | cut -d' ' -f1)" = "e685b85b04694e130c25b17d09cdd1892fbda5e9fa685e98b2300114b915aa2d"
          gdown 1EpqoamY0vFI2qE57R6wdqU5HwuoVk3Zz -O metadata.zip
          mkdir -p data/meta data/transcripts
          unzip -q metadata.zip -d data/meta
          unzip -q transcripts.zip -d data/transcripts
          echo "FEATURES=$(find data/meta -type f -name 'train_features*.csv' -print -quit)" >> "$GITHUB_ENV"
          echo "LABELS=$(find data/meta -type f -name 'train_labels*.csv' -print -quit)" >> "$GITHUB_ENV"
          FIRST=$(find data/transcripts -type f -name '*.csv' -print -quit)
          echo "TRANSCRIPTS=$(dirname "$FIRST")" >> "$GITHUB_ENV"
      - name: Run V125
        run: |
          cd competitions/trace_the_ace
          python v125_nested_calibration.py --features "../../$FEATURES" --labels "../../$LABELS" --transcripts "../../$TRANSCRIPTS" --rows 2500 --out ../../v125_nested_calibration.json
      - name: Show decision
        if: always()
        run: test -f v125_nested_calibration.json && cat v125_nested_calibration.json || true
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: trace-ace-v125-nested-calibration
          path: v125_nested_calibration.json
          retention-days: 14
          if-no-files-found: warn
