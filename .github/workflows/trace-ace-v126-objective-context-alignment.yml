name: Trace Ace V126 Objective Context Alignment

on:
  pull_request:
    branches: [agent/v121-cache-batch2]
    paths:
      - '.github/workflows/trace-ace-v126-objective-context-alignment.yml'
      - 'competitions/trace_the_ace/v126_objective_context_alignment.py'
  workflow_dispatch:

env:
  PREPARED_RUN_ID: '32400309220'
  EMBEDDING_RUN_ID: '32402681183'

jobs:
  evaluate:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      actions: read
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - name: Install dependencies
        run: python -m pip install --disable-pip-version-check numpy pandas scipy scikit-learn fastembed==0.8.0
      - name: Download exact frozen prepared artifact
        uses: actions/download-artifact@v4
        with:
          name: v121-prepared
          path: v121_prepared
          repository: heathsanchez/mathgraph
          run-id: ${{ env.PREPARED_RUN_ID }}
          github-token: ${{ secrets.GITHUB_TOKEN }}
      - name: Verify frozen manifest
        run: grep -q 'b1612f9fe4558680e468afb2a2452b75c603c244934fe62f7345feee68a61bc1' v121_prepared/manifest.json
      - name: Download all 128 frozen embeddings
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          mkdir -p v121_embedding_shards
          for i in $(seq 0 127); do
            gh run download "$EMBEDDING_RUN_ID" -n "v121-embeddings-$i" -D "v121_embedding_shards/$i"
          done
          test "$(find v121_embedding_shards -name 'v121_embeddings_shard_*.npz' | wc -l)" -eq 128
      - name: Run frozen V126
        run: |
          cd competitions/trace_the_ace
          python v126_objective_context_alignment.py --dir ../../v121_prepared \
            --embeddings ../../v121_embedding_shards --out ../../v126_objective_context_alignment.json
      - name: Show decision
        run: cat v126_objective_context_alignment.json
      - uses: actions/upload-artifact@v4
        with:
          name: trace-ace-v126-objective-context-alignment
          path: v126_objective_context_alignment.json
          retention-days: 14
