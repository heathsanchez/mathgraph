name: Trace Ace V128 Real Clock Pacing

on:
  pull_request:
    branches: [agent/v121-cache-batch2]
    paths:
      - '.github/workflows/trace-ace-v128-real-clock-pacing.yml'
      - 'competitions/trace_the_ace/v128_real_clock_pacing.py'
  workflow_dispatch:

env:
  PREPARED_RUN_ID: '32400309220'

jobs:
  evaluate:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    permissions:
      actions: read
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - name: Install dependencies
        run: python -m pip install --disable-pip-version-check numpy scipy scikit-learn pandas fastembed==0.8.0
      - name: Restore frozen transcript archive from GitHub cache only
        id: transcript-cache
        uses: actions/cache@v4
        with:
          path: transcripts.zip
          key: trace-ace-transcripts-v1-603547640
      - name: Require exact cache hit
        run: |
          test '${{ steps.transcript-cache.outputs.cache-hit }}' = 'true'
          test "$(stat -c%s transcripts.zip)" = '603547640'
          echo 'e685b85b04694e130c25b17d09cdd1892fbda5e9fa685e98b2300114b915aa2d  transcripts.zip' | sha256sum -c -
      - name: Download exact frozen V121 prepared artifact
        uses: actions/download-artifact@v4
        with:
          name: v121-prepared
          path: v121_prepared
          repository: heathsanchez/mathgraph
          run-id: ${{ env.PREPARED_RUN_ID }}
          github-token: ${{ secrets.GITHUB_TOKEN }}
      - name: Verify frozen sample
        run: grep -q 'b1612f9fe4558680e468afb2a2452b75c603c244934fe62f7345feee68a61bc1' v121_prepared/manifest.json
      - name: Run frozen V128
        run: python competitions/trace_the_ace/v128_real_clock_pacing.py --archive transcripts.zip --dir v121_prepared --out v128_real_clock_pacing.json
      - name: Show decision
        run: cat v128_real_clock_pacing.json
      - uses: actions/upload-artifact@v4
        with:
          name: trace-ace-v128-real-clock-pacing
          path: v128_real_clock_pacing.json
          retention-days: 14
